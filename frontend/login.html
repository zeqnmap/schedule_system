<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | EduSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="login.js" defer></script>
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center p-6 text-slate-900">
    <main class="w-full max-w-md bg-white rounded-[32px] p-8 shadow-2xl">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-600 mb-6"></div>
        <h1 class="text-3xl font-black mb-2">Вход в EduSync</h1>
        <p class="text-slate-500 font-medium mb-8">Доступ только для приглашённых пользователей</p>
        <form id="login-form" class="space-y-4">
            <input name="login" required autocomplete="username" placeholder="Логин" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-5 py-4 outline-none focus:border-emerald-500">
            <input name="password" required type="password" autocomplete="current-password" placeholder="Пароль" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-5 py-4 outline-none focus:border-emerald-500">
            <p id="error" class="hidden rounded-xl bg-rose-50 px-4 py-3 text-sm font-bold text-rose-700"></p>
            <button class="w-full rounded-2xl bg-emerald-600 py-4 font-extrabold text-white hover:bg-emerald-700">Войти</button>
        </form>
    </main>
</body>
</html>
