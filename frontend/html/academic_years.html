<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Учебные годы | EduSync</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/vue@3/dist/vue.global.js"></script><link rel="stylesheet" href="../css/app-shell.css"><script src="../js/auth.js" defer></script><script src="../js/app-nav.js" defer></script><script src="../js/academic_years.js" defer></script></head><body class="text-slate-800 antialiased min-h-screen"><nav class="fixed inset-x-0 top-0 z-50 bg-white/70 backdrop-blur-2xl border-b border-slate-200"></nav><main id="app" v-cloak class="max-w-[1100px] mx-auto px-6 lg:px-10 pt-32 pb-16"><header class="mb-10"><h1 class="text-4xl font-black text-slate-900">Учебные годы</h1><p class="text-slate-500 font-medium mt-2">Глобальный контекст расписания и семестров</p></header><section class="bento-card p-8 mb-8"><h2 class="text-2xl font-extrabold mb-6">{{ editingId ? 'Изменить год' : 'Создать учебный год' }}</h2><form @submit.prevent="save" class="grid gap-4 md:grid-cols-[1.2fr_1fr_1fr_auto]"><input v-model="form.name" required placeholder="Напр. 2026–2027" class="input-modern px-4 py-3 font-bold"><input v-model="form.start_date" required type="date" class="input-modern px-4 py-3 font-bold"><input v-model="form.end_date" required type="date" class="input-modern px-4 py-3 font-bold"><button class="btn-emerald rounded-2xl px-6 font-extrabold">{{ editingId ? 'Сохранить' : 'Добавить' }}</button></form><button v-if="editingId" @click="reset" class="mt-3 text-sm font-bold text-slate-500">Отмена</button></section><section class="space-y-3"><article v-for="year in years" :key="year.id" class="bg-white border border-slate-200 rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4"><div><h3 class="font-black text-lg">{{ year.name }}</h3><p class="text-sm text-slate-400 font-semibold">{{ year.start_date }} — {{ year.end_date }}</p></div><div class="flex gap-2"><span v-if="year.is_active" class="bg-emerald-50 text-emerald-700 px-3 py-2 rounded-xl text-xs font-black">Текущий</span><button v-else @click="activate(year)" class="bg-slate-100 px-3 py-2 rounded-xl text-xs font-bold">Выбрать</button><button @click="edit(year)" class="bg-slate-100 px-3 py-2 rounded-xl text-xs font-bold">Изменить</button></div></article></section><p v-if="errorMessage" class="mt-6 text-rose-600 font-bold">{{ errorMessage }}</p></main></body></html>
