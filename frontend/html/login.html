<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | EduSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/app-shell.css?v=20260933">
    <script src="../js/login.js" defer></script>
    <script src="../js/app-nav.js?v=20260933" defer></script>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-slate-900">
    <main class="relative z-10 w-full max-w-md rounded-[32px] border border-white/80 bg-white/90 p-8 shadow-[0_28px_80px_-24px_rgba(15,23,42,.38)] backdrop-blur-xl sm:p-10">
        <div class="mb-8 flex items-center justify-between gap-3"><div class="flex items-center gap-3"><div class="app-brand-mark">E</div><div class="app-brand-name">EduSync<small>2026</small></div></div><button type="button" class="theme-toggle" data-theme-toggle aria-label="Переключить тему" title="Переключить тему"><span class="theme-toggle-icon theme-toggle-sun">☼</span><span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span><span class="theme-toggle-icon theme-toggle-moon">☾</span></button></div>
        <p class="mb-2 text-xs font-black uppercase tracking-[0.22em] text-emerald-600">Закрытая рабочая система</p>
        <h1 class="mb-2 text-3xl font-black tracking-tight">Вход в кабинет</h1>
        <p class="mb-8 font-medium text-slate-500">Доступ только для приглашённых пользователей.</p>
        <form id="login-form" class="space-y-4">
            <input name="login" required autocomplete="username" placeholder="Логин" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-5 py-4 outline-none focus:border-emerald-500">
            <input name="password" required type="password" autocomplete="current-password" placeholder="Пароль" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-5 py-4 outline-none focus:border-emerald-500">
            <p id="error" class="hidden rounded-xl bg-rose-50 px-4 py-3 text-sm font-bold text-rose-700"></p>
            <button class="btn-emerald w-full rounded-2xl py-4 font-extrabold hover:bg-emerald-700">Войти в EduSync</button>
        </form>
    </main>
</body>
</html>
